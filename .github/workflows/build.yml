name: Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  GODOT: 4.6.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          curl -sSfLO $base/Godot_v$GODOT-stable_linux.x86_64.zip
          curl -sSfLO $base/Godot_v$GODOT-stable_export_templates.tpz
          unzip -q Godot_v$GODOT-stable_linux.x86_64.zip -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v$GODOT-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v$GODOT-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/$GODOT.stable
          rm *.zip *.tpz
      - name: Android ayarlari
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          "$RUNNER_TEMP/godot" --headless --import
      - name: Test APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --install-android-build-template --export-debug apk build/perilumi.apk
          # Android 11+ metin okuma motorunu gorebilmek icin gerekli
          f=android/build/src/main/AndroidManifest.xml
          [ -f "$f" ] || f=android/build/AndroidManifest.xml
          sed -i '0,/<application/s//<queries><intent><action android:name="android.intent.action.TTS_SERVICE" \/><\/intent><\/queries>\n    <application/' "$f"
          grep -n TTS_SERVICE "$f"
          "$RUNNER_TEMP/godot" --headless --export-debug apk build/perilumi.apk
          test -s build/perilumi.apk
      - name: Izin kontrolu
        run: |
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt2" dump badging build/perilumi.apk | grep -E "package:|[sS]dkVersion"
          "$bt/aapt2" dump permissions build/perilumi.apk
          if "$bt/aapt2" dump permissions build/perilumi.apk | grep -E "permission\.(INTERNET|ACCESS_|RECORD_|CAMERA|READ_|WRITE_)|AD_ID"; then exit 1; fi
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml build/perilumi.apk | grep -q TTS_SERVICE || { echo "TTS_SERVICE eksik"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: perilumi-test-apk
          path: build/perilumi.apk
      - name: Play AAB
        id: aab
        env:
          KEY: ${{ secrets.KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: perilumi
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then echo "Imza anahtari yok, AAB atlandi"; exit 0; fi
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/release.keystore"
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/godot" --headless --export-release aab build/perilumi.aab
          test -s build/perilumi.aab
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.ok
        with:
          name: perilumi-play-aab
          path: build/perilumi.aab
