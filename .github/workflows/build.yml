name: Android
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
env:
  GODOT: 4.6.2
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Godot
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          curl -sSfLO $base/Godot_v$GODOT-stable_linux.x86_64.zip
          curl -sSfLO $base/Godot_v$GODOT-stable_export_templates.tpz
          unzip -q Godot_v$GODOT-stable_linux.x86_64.zip -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v$GODOT-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          mkdir -p ~/.local/share/godot/export_templates
          unzip -q Godot_v$GODOT-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/$GODOT.stable
          rm *.zip *.tpz
      - name: Android ayarlari
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null
          keytool -genkeypair -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          "$RUNNER_TEMP/godot" --headless --import
      - name: Test APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build
          "$RUNNER_TEMP/godot" --headless --install-android-build-template --export-release apk build/perilumi.apk
          test -s build/perilumi.apk
          ls -l build/perilumi.apk
      - name: Izin kontrolu
        run: |
          bt="$ANDROID_HOME/build-tools/36.0.0"
          "$bt/aapt2" dump badging build/perilumi.apk | grep -E "package:|[sS]dkVersion"
          "$bt/aapt2" dump permissions build/perilumi.apk
          if "$bt/aapt2" dump permissions build/perilumi.apk | grep -E "permission\.(INTERNET|ACCESS_|RECORD_|CAMERA|READ_|WRITE_)|AD_ID"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: perilumi-test-apk
          path: build/perilumi.apk
      - name: Denetim dosyalari
        run: |
          mkdir -p proje/android
          (cd android/build && find . \( -name '*.gradle' -o -name gradle.properties -o -name AndroidManifest.xml \) -not -path '*/intermediates/*' -exec cp --parents {} ../../proje/android/ \;)
      - uses: actions/upload-artifact@v4
        with:
          name: denetim-proje
          path: proje
      - name: Play AAB
        id: aab
        env:
          KEY: ${{ secrets.KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: perilumi
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY" ]; then echo "Imza anahtari yok, AAB atlandi"; exit 0; fi
          echo "$KEY" | base64 -d > "$RUNNER_TEMP/release.keystore"
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/godot" --headless --export-release aab build/perilumi.aab
          test -s build/perilumi.aab
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.aab.outputs.ok
        with:
          name: perilumi-play-aab
          path: build/perilumi.aab

  # Third-party scanners run in their own job: no repository token, no signing secrets.
  denetim:
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: perilumi-test-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: denetim-proje
          path: proje
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: 16 KB sayfa uyumu
        run: |
          unzip -q -o apk/perilumi.apk 'lib/*' -d so
          for f in so/lib/*/*.so; do echo "$f $(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')"; done
      - name: greenlight (APK)
        run: |
          git init -q gl && cd gl
          git fetch -q --depth 1 https://github.com/RevylAI/greenlight fcb36e395bd4ae20448f2535382baecba9396fd9
          git checkout -q FETCH_HEAD
          go build -o ../greenlight ./cmd/greenlight
          cd .. && set +e
          ./greenlight playscan --apk apk/perilumi.apk; echo "greenlight cikis=$?"
      - name: app-store-compliance (Android proje dosyalari)
        run: |
          git init -q asc && cd asc
          git fetch -q --depth 1 https://github.com/mjmirza/app-store-compliance a6c44640f4b1ee2a0985be4a9e6cf8cc26decf57
          git checkout -q FETCH_HEAD
          cd .. && set +e
          bash asc/agent-os/hooks/app-store-compliance-guard.sh "$PWD/proje"; echo "guard cikis=$?"
