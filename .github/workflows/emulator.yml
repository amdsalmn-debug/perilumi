name: Emulator
on:
  push:
    branches: [test-emulator]
permissions:
  contents: read
env:
  GODOT: 4.6.2
jobs:
  oyna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: APK x86_64
        run: |
          base=https://github.com/godotengine/godot/releases/download/$GODOT-stable
          curl -sSfLO $base/Godot_v$GODOT-stable_linux.x86_64.zip
          curl -sSfLO $base/Godot_v$GODOT-stable_export_templates.tpz
          unzip -q Godot_v$GODOT-stable_linux.x86_64.zip -d "$RUNNER_TEMP"
          g="$RUNNER_TEMP/Godot_v$GODOT-stable_linux.x86_64"
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot build
          unzip -q Godot_v$GODOT-stable_export_templates.tpz
          mv templates ~/.local/share/godot/export_templates/$GODOT.stable
          rm *.zip *.tpz
          keytool -genkeypair -keystore "$RUNNER_TEMP/d.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 100 -dname "CN=Android Debug"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/editor_settings-4.6.tres
          sed -i 's/architectures\/x86_64=false/architectures\/x86_64=true/' export_presets.cfg
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$RUNNER_TEMP/d.keystore" GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          "$g" --headless --import
          "$g" --headless --install-android-build-template --export-debug apk build/perilumi.apk
          f=android/build/src/main/AndroidManifest.xml; [ -f "$f" ] || f=android/build/AndroidManifest.xml
          sed -i '0,/<application/s//<queries><intent><action android:name="android.intent.action.TTS_SERVICE" \/><\/intent><\/queries>\n    <application/' "$f"
          "$g" --headless --export-debug apk build/perilumi.apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -noaudio
          script: bash .github/oyna.sh
